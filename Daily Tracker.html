<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--s:#fff;--s2:#ece8e1;--tx:#1b1f2a;--mu:#6b7080;--ac:#e8a317;--wa:#2b8fe0;--gr:#1fa88a;--rd:#d9534f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--s:#1c212b;--s2:#262c39;--tx:#eef0f4;--mu:#9097a8;--ac:#f2c14e;--wa:#5bb8ff;--gr:#3ec9a7;--rd:#ff7a73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--s:#1c212b;--s2:#262c39;--tx:#eef0f4;--mu:#9097a8;--ac:#f2c14e;--wa:#5bb8ff;--gr:#3ec9a7;--rd:#ff7a73;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:30px;line-height:1.1;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
.sub{color:var(--mu);font-size:14px}
.name{border-bottom:2px dotted var(--ac);cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.card{background:var(--s);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.pill{background:var(--s);border-radius:20px;padding:12px 14px;position:relative;overflow:hidden;min-height:78px}
.pill .fill{position:absolute;left:0;bottom:0;height:100%;opacity:.16;transition:width .4s}
.pill b{font-size:22px;font-weight:800;position:relative}
.pill span{display:block;font-size:12.5px;color:var(--mu);position:relative}
.bar{height:8px;background:var(--s2);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--wa);transition:width .4s}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--s2)}
.task:first-of-type{border-top:0}
.task .t{flex:1;min-width:0}.task .t div{overflow-wrap:anywhere}
.task.done .t div{text-decoration:line-through;color:var(--mu)}.task.skip .t div{color:var(--mu);font-style:italic}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--mu);background:none;flex:none;cursor:pointer;display:grid;place-items:center;color:var(--bg);font-size:15px;padding:0}
.done .chk{background:var(--gr);border-color:var(--gr)}
.mini{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.tag{font-size:12.5px;color:var(--mu)}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--s2);border:2px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:#1b1f2a;border:0;border-radius:14px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--s2);color:var(--tx)}
.chip{background:var(--s2);border:0;border-radius:20px;padding:8px 14px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--s2)}
.nav button{flex:1;max-width:150px;background:none;border:0;padding:10px;border-radius:14px;color:var(--mu);font-weight:600;cursor:pointer}
.nav button.on{background:var(--s);color:var(--tx)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#1b1f2a;font-size:30px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--s);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}html{scroll-behavior:auto}}
.f{display:grid;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mu);display:grid;gap:4px}
.ex{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--s2)}
.ex:first-of-type{border-top:0}
.ex.done span{text-decoration:line-through;color:var(--mu)}
svg text{fill:var(--mu);font:11px 'Bricolage Grotesque',system-ui,sans-serif}
.empty{color:var(--mu);padding:8px 0}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--mu);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
:root{--bg:#fff3e2;--s:#ffffff;--s2:#f1e8ff;--tx:#251a3d;--mu:#6d6285;--ac:#ff8a00;--wa:#1e88ff;--gr:#00b884;--rd:#ff3b6b;--pu:#7b3ff2;--pk:#ff4f9a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f2a;--s:#241a45;--s2:#33265e;--tx:#ffffff;--mu:#b4a8d9;--ac:#ffb02e;--wa:#4cc3ff;--gr:#2ee6a8;--rd:#ff6b8a;--pu:#a98bff;--pk:#ff6fb5}}
:root[data-theme="dark"]{--bg:#150f2a;--s:#241a45;--s2:#33265e;--tx:#ffffff;--mu:#b4a8d9;--ac:#ffb02e;--wa:#4cc3ff;--gr:#2ee6a8;--rd:#ff6b8a;--pu:#a98bff;--pk:#ff6fb5}
body{background:var(--bg) linear-gradient(180deg,rgba(123,63,242,.14),rgba(255,79,154,.08) 40%,transparent 75%) no-repeat}
.hero{background:linear-gradient(135deg,var(--pu),var(--pk) 65%,var(--ac));color:#fff;border-radius:26px;padding:20px 18px}
.hero h1,.hero .name{color:#fff}.hero .sub{color:rgba(255,255,255,.9)}.hero .name{border-bottom-color:#fff}
.pill.w{background:linear-gradient(135deg,#1e88ff,#4cc3ff);color:#fff}.pill.s{background:linear-gradient(135deg,#00b884,#7ee08a);color:#fff}
.pill.w span,.pill.s span{color:rgba(255,255,255,.95)}.pill .fill{background:#fff!important;opacity:.22}
.card{border-left:6px solid var(--pu)}.card:nth-of-type(3n+2){border-left-color:var(--pk)}.card:nth-of-type(3n){border-left-color:var(--ac)}
.fab{background:linear-gradient(135deg,var(--pk),var(--ac));color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--pu),var(--pk));color:#fff}
.btn{background:linear-gradient(135deg,var(--pu),var(--pk));color:#fff}.btn.alt{background:var(--s2);color:var(--tx)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--s2)}
.seg button{border:0;border-radius:14px;padding:8px 2px;background:var(--s2);cursor:pointer;font-size:12.5px;line-height:1.2}
.seg button.on{background:linear-gradient(135deg,var(--pu),var(--pk));color:#fff}
.ex{grid-template-columns:auto auto 1fr 76px}
.ex .en{font-weight:600}.ex.done .en{text-decoration:line-through;color:var(--mu)}
.emo{width:50px;height:50px;border-radius:16px;border:0;font-size:28px;cursor:pointer;display:grid;place-items:center;padding:0}
.a-up{animation:aup .7s ease-in-out 3}.a-dip{animation:adip .7s ease-in-out 3}.a-swing{animation:asw .7s ease-in-out 3}
@keyframes aup{50%{transform:translateY(-12px) scale(1.2)}}
@keyframes adip{50%{transform:translateY(8px) scale(.85)}}
@keyframes asw{25%{transform:rotate(-28deg)}75%{transform:rotate(28deg)}}
@media (prefers-reduced-motion:reduce){.emo{animation:none!important}}
.hero{position:relative}.tt{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
.task.now{background:linear-gradient(90deg,rgba(255,79,154,.16),transparent);border-radius:12px;padding-left:8px;padding-right:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:18px;padding:12px 14px;color:#fff;display:grid}.tile span{font-size:22px}.tile b{font-size:22px;font-weight:800}.tile small{opacity:.92}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.dnav button{width:42px;height:42px;border-radius:12px;border:0;background:var(--s);font-size:22px;cursor:pointer}.dnav button:disabled{opacity:.35}.dnav input{flex:1;text-align:center;font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--s2);padding:11px 0;cursor:pointer;text-align:left}.hrow:first-of-type{border-top:0}
.big{font-size:84px;line-height:1.15;display:inline-block;margin:4px 0}
.gs b{display:block;margin-top:12px}.gs ol{margin:4px 0 0;padding-left:20px}.gs li{margin:4px 0}.gs p{margin:4px 0 0}
@media (prefers-reduced-motion:reduce){.big{animation:none!important}}
#fg{background:var(--s2);border-radius:18px;max-height:280px}.bl{stroke-width:7;stroke-linecap:round;fill:none}.lt{stroke:var(--pu)}.lu{stroke:var(--pk)}.ll{stroke:var(--wa)}#fg.bad .bl{stroke:var(--rd)}
.cap{text-align:center;font-weight:600;margin-top:8px}.chip.on{background:linear-gradient(135deg,var(--pu),var(--pk));color:#fff}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:6px 0 10px}.nm b{display:block;font-size:19px;font-weight:800}.nm span{display:block;font-size:11.5px;color:var(--mu);line-height:1.2}
.seg{grid-template-columns:repeat(3,1fr)}.fpv{width:100%;max-height:200px;object-fit:cover;border-radius:14px}
.frow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--s2)}.frow>div{flex:1;min-width:0}
.corner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:15;display:flex;gap:8px}.corner button{width:40px;height:40px;border-radius:50%;border:0;background:var(--s);color:var(--tx);font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
main{padding-top:58px}
.ghead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:2px 0}.ghead>span:nth-child(2){flex:1}.gi{font-size:30px}.chev{color:var(--mu)}
.foodbox{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:16px;padding:10px 12px}
.filebtn{position:relative;overflow:hidden;display:inline-block}.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;font-size:0}
.tap{cursor:pointer}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}.ci>span{width:68px;font-size:13px;color:var(--mu)}.ci>div{display:flex;gap:6px}
.cib{border:0;background:var(--s2);border-radius:12px;width:40px;height:40px;font-size:20px;cursor:pointer;padding:0}.cib.on{background:linear-gradient(135deg,var(--pu),var(--pk))}
.sr{background:var(--s2);border:0;border-radius:10px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;margin:3px 0}
.grp{font-weight:800;color:var(--pk);margin:14px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.fgs .gl{stroke:var(--wa);opacity:.55;fill:none}.fgs .bd{stroke:#d6dae3}.fgs .glc{fill:var(--wa);opacity:.55}.fgs .bdc{fill:#d6dae3}.fgs .mus{stroke:#ff7a1a;fill:#ff7a1a;opacity:.92}
.fgs.bad .gl{stroke:var(--rd)}.fgs.bad .glc{fill:var(--rd)}
#fg{background:#151a28;border-radius:18px;max-height:280px}
.emo.fig{width:92px;height:92px;background:#151a28;border-radius:18px;overflow:hidden;padding:0;display:block}.emo.fig svg{width:100%;height:100%;display:block}
.ex{grid-template-columns:auto auto 1fr 62px;gap:8px}
.emo.fig canvas{width:100%;height:100%;display:block}
.quote{position:relative;overflow:hidden;border-radius:26px;padding:28px 18px 16px;text-align:center;background:radial-gradient(circle at 50% -10%,rgba(255,170,40,.38),transparent 62%),linear-gradient(180deg,#1d140a,#0b0806);color:#e3b867;font-family:Cinzel,Georgia,'Times New Roman',serif;margin-bottom:14px;cursor:pointer;min-height:190px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.qa{font-size:clamp(24px,8vw,36px);font-weight:700;letter-spacing:.1em;line-height:1.15}
.qb{font-size:clamp(19px,6.2vw,28px);font-weight:700;letter-spacing:.06em;line-height:1.2;margin-top:2px}
.qs{display:flex;align-items:center;gap:10px;margin-top:14px}.qs i{flex:1;height:1px;background:#b88a3e;opacity:.7}.qs span{font-size:11px;letter-spacing:.16em;color:#eadfc9;line-height:1.5}
.qdots{display:flex;justify-content:center;gap:8px;margin-top:16px}.qd{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#6d5a3a;cursor:pointer}.qd.on{background:#f1cf8b}
.nav button{padding:10px 4px;font-size:13.5px}
.trow{padding:10px 0;border-top:1px solid var(--s2);cursor:pointer}.trow:first-of-type{border-top:0}
.bs{display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;margin-top:4px}.bs.Bullish{background:rgba(0,184,132,.2);color:var(--gr)}.bs.Bearish{background:rgba(255,59,107,.18);color:var(--rd)}.bs.Neutral{background:var(--s2);color:var(--mu)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}.mt{background:var(--s2);border-radius:12px;padding:8px 10px}.mt b{font-size:17px}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hb{display:grid;grid-template-columns:56px 1fr 62px;gap:8px;align-items:center;margin:7px 0}.hb>div{background:var(--s2);border-radius:8px;height:14px;overflow:hidden}.hb i{display:block;height:100%}.hb b{text-align:right;font-size:13px}
</style>
</head>
<body>
<div class="corner"><button data-act="prof" aria-label="Profile">👤</button><button data-act="theme" aria-label="Switch light or dark mode">◐</button></div>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='daily-tracker-v1';
const DEF_GYM={0:'Rest day',1:'Push\nBench press 4x8\nOverhead press 3x10\nTricep pushdown 3x12',2:'Pull\nBarbell row 4x8\nLat pulldown 3x10\nBicep curl 3x12',3:'Legs\nSquats 3x10\nLeg press 4x12\nCalf raise 3x15',4:'Rest day',5:'Upper\nIncline press 3x10\nPull-up 3x8\nLateral raise 3x15',6:'Lower\nDeadlift 3x5\nLunges 3x12\nLeg curl 3x12'};
const PLAN={0:'Rest day',1:'Chest + Shoulders + Triceps\nMachine Chest Press 3x8-12\nIncline Dumbbell Press 3x8-12\nCable Chest Fly 2x12-15\nSeated Dumbbell Shoulder Press 3x8-12\nDumbbell Lateral Raise 3x12-15\nCable Triceps Pushdown 3x10-15\nOverhead Cable Triceps Extension 2x10-15\nCardio 10-15 min easy',2:'Back + Biceps + Rear Delts\nLat Pulldown 3x8-12\nSeated Cable Row 3x8-12\nChest-Supported Row 3x8-12\nStraight-Arm Pulldown 2x12-15\nFace Pull 3x12-15\nReverse Pec Deck 2x12-15\nDumbbell Curl 3x10-12\nHammer Curl 2x10-12\nCardio 10-15 min easy',3:'Legs + Core\nLeg Press 3x8-12\nGoblet Squat 3x8-12\nLeg Extension 2x12-15\nRomanian Deadlift 3x8-12\nLeg Curl 3x10-15\nStanding Calf Raise 3x12-15\nCable Crunch 3x10-15\nPlank 3x30-60 sec\nCardio optional 5-10 min easy',4:'Upper Body\nBench Press / Machine Chest Press 3x8-12\nLat Pulldown 3x8-12\nSeated Cable Row 3x8-12\nDumbbell Lateral Raise 3x12-15\nFace Pull 2x12-15\nDumbbell Biceps Curl 2x10-12\nCable Triceps Pushdown 2x10-12\nCardio 10-15 min easy',5:'Lower Body + Arms + Core\nLeg Press 3x8-12\nRomanian Deadlift 3x8-12\nLeg Extension 2x12-15\nLeg Curl 2x12-15\nSeated/Standing Calf Raise 3x12-15\nHammer Curl 2x10-12\nOverhead Triceps Extension 2x10-12\nHanging Knee Raise 3x8-15\nPlank 3x30-60 sec\nCardio 10 min easy',6:'Rest day'};
const PLAN3={0:'Rest day',1:'Chest & Triceps\nChest | Flat Barbell / DB Bench Press 4x8-10\nChest | Incline Dumbbell Press 3x10-12\nChest | Flat Fly (Dumbbell / Machine) 3x12\nChest | Flat Chest Press (Machine) 3x10-12\nTriceps | Dumbbell Skull Crushers 3x10-12\nTriceps | Tricep Extension (Overhead) 3x10-12\nTriceps | Tricep Kickbacks (Machine) 3x12\nTriceps | Tricep Pushdown (Machine / Rope) 3x12-15',2:'Back & Biceps\nBack | Lat Pulldown (Wide Grip) 4x10-12\nBack | Bent-Over Barbell Rows 4x8-10\nBack | Single-Arm Dumbbell Rows 3x10 / side\nBack | Straight-Arm Pulldowns 3x12-15\nBiceps | Dumbbell Biceps Curls 3x10-12\nBiceps | Dumbbell Hammer Curls 3x12\nBiceps | Preacher Curls 3x10-12',3:'Shoulders\nShoulders | Shoulder Press 4x8-10\nShoulders | Lateral Raises 4x12-15\nShoulders | Machine Rear Flys 3x12-15\nTraps | Lat Pulldown (Back/Upper Back) 4x10-12\nTraps | Inclined Dumbbells 3x10-12\nTraps | Cable Rope Pull Variation 3x12-15',4:'Chest & Back\nChest | Incline Barbell Bench Press 3x8-10\nChest | Flat Dumbbell Flyes 3x12\nChest | Flat Chest Press (Machine) 3x10-12\nBack | Pull-Ups (or Assisted Pull-Ups) 3xfailure\nBack | Chest-Supported T-Bar Rows 3x10-12\nBack | Push-Ups (Finisher) 2xfailure',5:'Legs & Abs\nLegs | Sumo Squats 4x8-10\nLegs | Lunges 3x10 / leg\nLegs | Goblet / Caplet Squats 3x10-12\nLegs | Calf Raises 4x15-20\nLegs | Leg Curl 3x12-15\nLegs | Leg Press 4x8-10\nAbs | Rope Crunches 3x15\nAbs | Hanging Leg Raises 3x10-12\nAbs | V-Ups 3xfailure',6:'Rest day'};
const PLAN_AM={0:'Rest day',1:'Chest & Triceps\nChest | Push Ups 4x15-20\nChest | Decline Push Ups 3x12-15\nChest | Wide Push Ups 3x15\nChest | Knee Push Ups 3x15\nChest | Diamond Push Up 3x12\nTriceps | Tricep Pushup 3x12\nTriceps | Dips Bench 3x15\nTriceps | Diamond Pushup 3x12',2:'Back & Biceps\nBack | Supermans 4x15\nBack | Aquamans 3x15\nBack | Backpedal Plank 3x45s hold\nBack | Towel Pulls 3x15\nBack | Reverse Towel Pulls 3x15\nBiceps | Towel Isometric Biceps Curls 3x45s tension',3:'Shoulders & Triceps\nShoulders | Pike Pushup 4x12\nShoulders | Alt Shoulder Tap 3x20 taps\nShoulders | Front Raise Pushup 3x10-12\nTriceps | Close-Grip Bench Dips 3x15',4:'Chest & Back\nChest | Incline / Decline Push Ups 4x15\nChest | Standard Push Ups 3x20\nBack | Supermans & Towel Pulls 4x15\nBack | Reverse Towel Pulls 3x15',5:'Abs & Legs\nAbs | V-Ins and Outs 3x15\nAbs | Russian Twists 3x20 / side\nAbs | Oblique Crunch 3x15 / side\nAbs | Reverse Crunch 3x15\nAbs | Leg Raises & Flutter Kicks 3x15 / 30s\nLegs | Air Squat 4x20\nLegs | Lunge Hops 3x12\nLegs | High Knees 3x45s run\nLegs | Jumping Lunges 3x12 / leg',6:'Rest day'};
let S={name:'',goal:2500,gym:PLAN3,gymAM:PLAN_AM,prof:{},days:{},tpl:null,gymV:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.gymV!==3){S.gym=PLAN3;S.gymV=3}
if(S.amV!==1){S.gymAM=PLAN_AM;S.amV=1}
if(!S.name)S.name='Balaji';
if(S.theme)document.documentElement.dataset.theme=S.theme;
let VK=null;const PEND={};

function chartBar(title,days,series,fmt,legend){
  const W=320,H=130,bw=26,gap=(W-7*bw)/8,tot=days.map((_,i)=>series.reduce((a,s)=>a+s.v[i],0)),mx=Math.max(...tot,1);

function chartLine(title,days,series,fmt,legend,lo=0,sk=false){

    if(series.length===1)svg+=`<polygon points='${X(0)},${H-22} ${pts} ${X(6)},${H-22}' fill='${s.c}' opacity='.15'/>`;
    svg+=`<polyline points='${pts}' fill='none' stroke='${s.c}' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>`;
    s.v.forEach((v,i)=>{if(sk&&!(v>0))return;svg+=`<circle cx='${X(i)}' cy='${Y(v)}' r='4' fill='${s.c}'/>`;if(series.length===1&&v>0)svg+=`<text x='${X(i)}' y='${Y(v)-9}' text-anchor='middle'>${fmt(v)}</text>`})});

  sheet(`<h2>Add to today</h2>${b}<div class="seg">${modes.map(([k,e,l])=>`<button data-act="mode" data-m="${k}" class="${addMode===k?'on':''}"><span style="display:block;font-size:20px">${k==='food'?foodIcon(24):e}</span>${l}</button>`).join('')}</div>`);
}
function editGym(){const dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];sheet(`<h2>Weekly routine</h2><div class="sub" style="margin-bottom:10px">First line is the day's focus. One exercise per line, like Squats 3x10.</div><div class="f">${dn.map((n,i)=>`<label>${n}<textarea rows="4" data-gd="${i}">${esc(S.gym[i]||'Rest day')}</textarea></label>`).join('')}<button class="btn" data-act="close">Done</button></div>`)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const a=t.dataset.act,d=day(),id=+t.dataset.id;
  if(a==='close'){if(t.classList.contains('shade')&&e.target!==t)return;close();render()}
  else if(a==='name')sheet(`<h2>Your name</h2><div class='f'>${fld('nm_i','Name',S.name)}<button class='btn' data-act='svname'>Save</button></div>`);
  else if(a==='svname'){S.name=gv('nm_i')||'Balaji';save();close();render()}
  else if(a==='done'){const k=d.tasks.find(x=>x.id===id);k.s=k.s===1?0:1;save();render()}
  else if(a==='skip'){const k=d.tasks.find(x=>x.id===id);k.s=k.s===2?0:2;save();render()}
  else if(a==='del'){const k=d.tasks.find(x=>x.id===id);if(k&&k.rg){sheet(`<h2>Remove this task</h2><div class='sub'>It repeats on other days.</div><div class='f' style='margin-top:12px'><button class='btn alt' data-act='delone' data-id='${id}'>Only this day</button><button class='btn' style='background:var(--rd)' data-act='delall' data-id='${id}'>All days from here on</button><button class='btn alt' data-act='close'>Cancel</button></div>`)}else{d.tasks=d.tasks.filter(x=>x.id!==id);save();render()}}
  else if(a==='delone'){d.tasks=d.tasks.filter(x=>x.id!==id);save();close();render()}
  else if(a==='delall'){const k=d.tasks.find(x=>x.id===id),cur=VK||dk();if(k){for(const dy in S.days)if(dy>=cur)S.days[dy].tasks=S.days[dy].tasks.filter(x=>x.rg!==k.rg);d.tasks=d.tasks.filter(x=>x.rg!==k.rg)}save();close();render()}
  else if(a==='addwater')addMenu('water');
  else if(a==='mode')addMenu(t.dataset.m);
  else if(a==='addsteps')addMenu('steps');
  else if(a==='w'){d.water=Math.max(0,d.water+ +t.dataset.n);save();render();if($('#modal').innerHTML)addMenu()}
  else if(a==='savesteps'){d.steps+=Math.max(0,parseInt($('#ns').value)||0);save();close();render()}
  else if(a==='savetask'){const n=$('#nt').value.trim();if(!n){$('#nt').style.borderColor='var(--rd)';return}
    const u=$('#nu').value,c=Math.max(1,Math.min(parseInt($('#nn').value)||1,u==='m'?24:365)),base=vd(),id0=Date.now(),cat=$('#nc').value,end=new Date(base);
    if(u==='d')end.setDate(end.getDate()+c-1);else if(u==='m'){end.setMonth(end.getMonth()+c);end.setDate(end.getDate()-1)}
    const rep=u==='d'?'every day, '+c+(c===1?' day':' days'):u==='m'?'every day, '+c+(c===1?' month':' months'):'';
    for(const x=new Date(base);x<=end;x.setDate(x.getDate()+1)){const k=dk(x),dd=(k===(VK||dk()))?d:(S.days[k]||(S.days[k]={tasks:[],water:0,steps:0,bed:'23:00',wake:'07:00',gym:{}}));dd.tasks.push({id:id0+Math.floor(Math.random()*1e6),t:n,time:'',min:0,cat,s:0,rep,rg:id0})}
    save();close();render()}
  else if(a==='savetodo'){const L=$('#nl').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!L.length){$('#nl').style.borderColor='var(--rd)';return}L.forEach((x,i)=>d.tasks.push({id:Date.now()+i,t:x,time:'',min:0,cat:'To-do',s:0}));save();close();render()}
  else if(a==='savetpl'){S.tpl=d.tasks.map(({t,time,end,min,cat})=>({t,time,end,min,cat}));save();render()}
  else if(a==='usetpl'){S.tpl.forEach((x,i)=>d.tasks.push({...x,id:Date.now()+i,s:0}));save();render()}
  else if(a==='gdone'){const i=t.dataset.i,L=t.dataset.s==='am'?(d.gm=d.gm||{}):d.gym;L[i]=L[i]||{};L[i].done=!L[i].done;save();render()}
  else if(a==='editgym')editPlan(0);
  else if(a==='editam')editPlan(1);
  else if(a==='dprev'){shift(-1);render()}
  else if(a==='dnext'){if(VK){shift(1);render()}}
  else if(a==='dtoday'){VK=null;render()}
  else if(a==='goto'){VK=t.dataset.k>=dk()?null:t.dataset.k;tab='today';render();window.scrollTo(0,0)}
  else if(a==='theme'){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}
  else if(a==='rename'){const k=d.tasks.find(x=>x.id===id);if(k)sheet(`<h2>Edit task</h2><div class='f'>${fld('rn_i','Task',k.t)}<button class='btn' data-act='svren' data-id='${id}'>Save</button></div>`)}
  else if(a==='svren'){const k=d.tasks.find(x=>x.id===id),v=gv('rn_i');if(k&&v){k.t=v;save()}close();render()}
  else if(a==='rest'){clearInterval(RT);let n=+t.dataset.n;showRT(n);RT=setInterval(()=>{n--;showRT(n);if(n<=0){clearInterval(RT);try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}},1000)}
  else if(a==='prof')profSheet();
  else if(a==='saveprof'){S.prof={sex:$('#ps').value,age:+$('#pa').value||0,h:+$('#ph').value||0,goal:$('#pg').value};save();close();render()}
  else if(a==='addfood')addMenu('food');
  else if(a==='addwt')addMenu('weight');
  else if(a==='delfood'){d.food=(d.food||[]).filter(x=>x.id!==id);save();render()}
  else if(a==='editsr')srSheet(t.dataset.s,+t.dataset.i);
  else if(a==='savesr'){const wd=vd().getDay(),src=t.dataset.s==='am'?S.gymAM:S.gym,L=(src[wd]||'').split('\n').map(x=>x.trim()).filter(Boolean),k=+t.dataset.i+1;if(!L[k])return;const p=exp(L[k]),q=srOf(p.t),sets=Math.max(1,parseInt($('#ss').value)||1),reps=$('#sr2').value.trim()||'10';L[k]=(p.g?p.g+' | ':'')+q.n+' '+sets+'x'+reps;src[wd]=L.join('\n');save();close();render()}
  else if(a==='qnext'){QI=(QI+1)%QS.length;$('#qc').innerHTML=qInner()}
  else if(a==='qgo'){QI=+t.dataset.n;$('#qc').innerHTML=qInner()}
  else if(a.slice(0,3)==='tr_')trAct(a,t);
  else if(a==='foodai')foodAI();
  else if(a==='camopen')camOpen();
  else if(a==='camshot')camShot();
  else if(a==='sleepopen')sleepSheet();
  else if(a==='savesleep'){const b=$('#sb').value,w=$('#sw').value;if(!b||!w)return;d.bed=b;d.wake=w;d.sh=null;d.sl=1;save();close();render()}
  else if(a==='ci'){d.ci=d.ci||{};const k=t.dataset.k,n=+t.dataset.n;d.ci[k]=d.ci[k]===n?0:n;save();render()}
  else if(a==='gopen'){GO=GO===t.dataset.s?null:t.dataset.s;render()}
  else if(a==='savefood'){const k=+$('#fk').value;if(!(k>0)){$('#fk').style.borderColor='var(--rd)';return}d.food=d.food||[];d.food.push({id:Date.now(),n:$('#fname').value.trim()||'Meal',kcal:Math.round(k),p:Math.round(+$('#fpp').value||0),c:Math.round(+$('#fc').value||0),f:Math.round(+$('#ff').value||0),fb:Math.round(+$('#fb').value||0),m:$('#fm').value});FIMG=null;FURL='';save();close();render()}
  else if(a==='savewt'){const v=parseFloat($('#nw').value),bm={};['waist','chest','arm','thigh'].forEach(k=>{const x=parseFloat($('#bm_'+k).value);if(x>0)bm[k]=x});const okw=v>20&&v<400;if(!okw&&!Object.keys(bm).length){$('#nw').style.borderColor='var(--rd)';return}if(okw)d.wt=Math.round(v*10)/10;if(Object.keys(bm).length)d.bm=Object.assign(d.bm||{},bm);save();close();render()}
  else if(a==='ct'){CT=t.dataset.v;S.ct=CT;save();render()}
  else if(a==='play')showGuide(+t.dataset.i,t.dataset.s)
  else if(a==='fm'){ANBAD=+t.dataset.v;const fgE=$('#fg');if(fgE)fgE.classList.toggle('bad',!!ANBAD);$('#cap').textContent=ANBAD?'Mistake: '+ANX:AN[ANK].c;t.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t));startAnim(ANK,ANX)}
});
document.addEventListener('change',e=>{
  const t=e.target,d=day();
  if(t.dataset.dp!==undefined){VK=(t.value&&t.value<dk())?t.value:null;render()}
  else if(t.dataset.sh!==undefined){const v=parseFloat(t.value);d.sh=isNaN(v)?null:Math.min(16,Math.max(0,v));d.sl=isNaN(v)?0:1;save();render()}
  else if(t.dataset.f){d[t.dataset.f]=t.value;d.sl=1;save();render()}
  else if(t.dataset.f2){S.goal=Math.max(250,parseInt(t.value)||2500);save();render()}
  else if(t.dataset.gw!==undefined){const i=t.dataset.gw,L=t.dataset.s==='am'?(d.gm=d.gm||{}):d.gym;L[i]=L[i]||{};L[i].w=t.value;save()}
  else if(t.dataset.gd!==undefined){(t.dataset.am?S.gymAM:S.gym)[t.dataset.gd]=t.value;save()}
});
$('#fab').addEventListener('click',addMenu);
render();
setInterval(()=>{if(tab==='today'&&!$('#modal').innerHTML&&!document.activeElement.matches('input'))render()},60000);
</script>
